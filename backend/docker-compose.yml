services:
  api:
    build: .
    container_name: farmacia_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Configure DATABASE_URL_DOCKER in backend/.env}
      IMAGE_REFERENCE_STORE_PATH: /app/data/image_references/references.json
    volumes:
      - ./data/image_references:/app/data/image_references
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always

  image-maintenance:
    build: .
    container_name: farmacia_image_maintenance
    profiles: ["maintenance"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Configure DATABASE_URL_DOCKER in backend/.env}
      IMAGE_MONITOR_ENABLED: ${IMAGE_MONITOR_ENABLED:-true}
      IMAGE_RECOVERY_ENABLED: ${IMAGE_RECOVERY_ENABLED:-true}
      IMAGE_MONITOR_BATCH_SIZE: ${IMAGE_MONITOR_BATCH_SIZE:-100}
      IMAGE_RECOVERY_BATCH_SIZE: ${IMAGE_RECOVERY_BATCH_SIZE:-100}
      IMAGE_MONITOR_RECHECK_HOURS: ${IMAGE_MONITOR_RECHECK_HOURS:-24}
      IMAGE_MONITOR_CONCURRENCY: ${IMAGE_MONITOR_CONCURRENCY:-4}
      IMAGE_MONITOR_HOST_INTERVAL: ${IMAGE_MONITOR_HOST_INTERVAL:-0.5}
      IMAGE_MAINTENANCE_INTERVAL_SECONDS: ${IMAGE_MAINTENANCE_INTERVAL_SECONDS:-86400}
    command:
      - sh
      - -c
      - |
        while true; do
          python scripts/manter_imagens_catalogo.py check
          python scripts/manter_imagens_catalogo.py recover-pending
          sleep "$${IMAGE_MAINTENANCE_INTERVAL_SECONDS:-86400}"
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  pacheco-scheduler:
    build: .
    container_name: farmacia_pacheco_scheduler
    command: ["python", "-m", "app.scrapers.pacheco_scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Configure DATABASE_URL_DOCKER in backend/.env}
      IMAGE_REFERENCE_STORE_PATH: /app/data/image_references/references.json
      PACHECO_STATE_DIR: /app/data/pacheco
      PACHECO_SCHEDULER_ENABLED: ${PACHECO_SCHEDULER_ENABLED:-false}
      PACHECO_INTERVAL_HOURS: ${PACHECO_INTERVAL_HOURS:-24}
      PACHECO_FAILURE_RETRY_MINUTES: ${PACHECO_FAILURE_RETRY_MINUTES:-60}
      PACHECO_REQUEST_DELAY_SECONDS: ${PACHECO_REQUEST_DELAY_SECONDS:-1}
    env_file:
      - .env
    volumes:
      - ./data/image_references:/app/data/image_references
      - ./data/pacheco:/app/data/pacheco
    depends_on:
      db:
        condition: service_healthy
    restart: always

  offer-refresh:
    build: .
    container_name: farmacia_offer_refresh
    command: ["python", "-m", "app.scrapers.offer_refresh_scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Configure DATABASE_URL_DOCKER in backend/.env}
      OFFER_REFRESH_STATE_DIR: /app/data/offer_refresh
      OFFER_REFRESH_ENABLED: ${OFFER_REFRESH_ENABLED:-false}
      OFFER_REFRESH_INTERVAL_MINUTES: ${OFFER_REFRESH_INTERVAL_MINUTES:-30}
      OFFER_REFRESH_INDIANA_BATCH: ${OFFER_REFRESH_INDIANA_BATCH:-200}
      OFFER_REFRESH_ARAUJO_BATCH: ${OFFER_REFRESH_ARAUJO_BATCH:-20}
      OFFER_REFRESH_REQUEST_DELAY_SECONDS: ${OFFER_REFRESH_REQUEST_DELAY_SECONDS:-1}
    env_file:
      - .env
    volumes:
      - ./data/offer_refresh:/app/data/offer_refresh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: farmacia_postgres
    restart: always
    ports:
      - "4242:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB in backend/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: farmacia_tunnel
    command: tunnel --url http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
