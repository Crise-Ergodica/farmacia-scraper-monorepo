services:
  api:
    build: .
    container_name: farmacia_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: farmacia_postgres
    restart: always
    environment:
      POSTGRES_USER: aurora_admin
      POSTGRES_PASSWORD: super_senha_segura
      POSTGRES_DB: farmacia_db
    ports:
      - "4242:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora_admin -d farmacia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: farmacia_tunnel
    command: tunnel --url http://api:8000
    depends_on:
      - api

volumes:
  postgres_data: