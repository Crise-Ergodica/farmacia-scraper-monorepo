[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "farmacia-scraper-api"
version = "0.1.0"
description = "API RESTful em FastAPI para extração e consulta de preços de medicamentos"
authors = ["Aurora <seu-email@exemplo.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.23.0"}
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
sqlalchemy = ">=2.0.0"
alembic = ">=1.11.0"
httpx = ">=0.24.0"
beautifulsoup4 = ">=4.12.0"
psycopg2-binary = "^2.9.11"
curl-cffi = "^0.15.0"
email-validator = "^2.3.0"
playwright = "^1.60.0"
openpyxl = "^3.1.5"
pandas = "^3.0.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
ruff = ">=0.0.280"

# Configurações do Linter Ruff
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

# Configurações do Pytest
[tool.pytest.ini_options]
addopts = "-v --asyncio-mode=auto"
testpaths = ["tests"]