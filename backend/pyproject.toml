[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farmacia-scraper-api"
version = "0.1.0"
description = "API RESTful em FastAPI para extração e consulta de preços de medicamentos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Framework web e servidor assíncrono
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # Banco de Dados e ORM (compatível com SQLite inicial)
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    
    # Ferramentas de Web Scraping
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.0.280",
    "black>=23.7.0"
]

# Configurações do Linter Ruff (substitui Flake8 e Isort)
[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = []

# Configurações do Pytest
[tool.pytest.ini_options]
addopts = "-v --asyncio-mode=auto"
testpaths = ["tests"]